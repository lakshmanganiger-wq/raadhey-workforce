name: Build RAADHEY Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Add Lexend font
        run: |
          mkdir -p app/src/main/assets
          curl -fL 'https://raw.githubusercontent.com/google/fonts/main/ofl/lexend/Lexend%5Bwght%5D.ttf' -o app/src/main/assets/Lexend.ttf
      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/RAADHEY-TEXTILE-PRINTING-AND-APPAREL-SOLUTIONS.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAADHEY-TEXTILE-PRINTING-AND-APPAREL-SOLUTIONS
          path: app/build/outputs/apk/debug/RAADHEY-TEXTILE-PRINTING-AND-APPAREL-SOLUTIONS.apk
          if-no-files-found: error
