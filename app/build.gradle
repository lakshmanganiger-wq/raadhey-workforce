plugins {
    id 'com.android.application'
}

def localSupabase = new Properties()
def localConfig = file('supabase.properties')
if (localConfig.exists()) {
    localConfig.withInputStream { localSupabase.load(it) }
}
def supabaseUrl = (project.findProperty('supabaseUrl') ?: System.getenv('SUPABASE_URL') ?: localSupabase.getProperty('SUPABASE_URL', '')).toString()
def supabaseAnonKey = (project.findProperty('supabaseAnonKey') ?: System.getenv('SUPABASE_ANON_KEY') ?: localSupabase.getProperty('SUPABASE_ANON_KEY', '')).toString()

android {
    namespace 'com.raadhey.workforce'
    compileSdk 35
    defaultConfig {
        applicationId 'com.raadhey.workforce.v2'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        buildConfigField 'String', 'SUPABASE_URL', '"' + supabaseUrl.replace('"','\\\"') + '"'
        buildConfigField 'String', 'SUPABASE_ANON_KEY', '"' + supabaseAnonKey.replace('"','\\\"') + '"'
    }
    buildFeatures { buildConfig true }
}
